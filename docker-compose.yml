# =====================================================================
# Real-Time Fraud Detection Platform - 100% free / open-source stack
# =====================================================================
services:
  # ---------------- Message Broker ----------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: fdp-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fdp-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---------------- Storage ----------------
  redis:
    image: redis:7-alpine
    container_name: fdp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: fdp-postgres
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fraud
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: fdp-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  # ---------------- Application services ----------------
  inference:
    build:
      context: .
      target: inference
    container_name: fdp-inference
    command: uvicorn src.inference.app:app --host 0.0.0.0 --port 8000
    environment: &app_env
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+psycopg2://fraud:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/fraud
      MLFLOW_TRACKING_URI: http://mlflow:5000
      INFERENCE_URL: http://inference:8000
      MODEL_NAME: fraud_xgb
      MODEL_STAGE: Production
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health',timeout=3)); assert d['model_loaded']"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  stream-processor:
    build:
      context: .
      target: stream
    container_name: fdp-stream
    command: python -m src.streaming.consumer
    environment: *app_env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy

  producer:
    build:
      context: .
      target: producer
    container_name: fdp-producer
    command: python -m src.datagen.producer --csv data/processed/demo_transactions.csv --rate 20
    environment: *app_env
    profiles: ["demo"]
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: fdp-dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment: *app_env
    ports:
      - "8502:8501"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy

volumes:
  pgdata:
  mlflow_data:
